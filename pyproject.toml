[build-system]
requires = ["scikit-build-core", "nanobind>=2.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "raw-player"
authors = [{ name = "Shiguredo Inc.", email = "contact+pypi@shiguredo.jp" }]
dynamic = ["version"]
description = "Raw audio/video player for Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Source = "https://github.com/shiguredo/raw-player"
Discord = "https://discord.gg/shiguredo"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "example" },
]
test = ["pytest", "pytest-timeout", "numpy"]
lint = ["ruff", "ty"]
example = [
    "numpy",
    "webcodecs-py",
    "mp4-py",
    "blend2d-py",
    "uvc-py",
    "portaudio-py",
]

[tool.scikit-build]
minimum-version = "0.11.3"
sdist.include = ["VERSION"]
build-dir = "_build/{wheel_tag}"

[tool.scikit-build.build]
verbose = false

[tool.scikit-build.cmake]
version = ">=4.2"
define = { "CMAKE_CXX_STANDARD" = "20" }
args = ["-DCMAKE_BUILD_TYPE=Release"]

[tool.scikit-build.wheel]
packages = ["src/raw_player"]
expand-macos-universal-tags = true

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>.+)$"

[tool.uv]
package = false
managed = true
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
