[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.9"]
build-backend = "scikit_build_core.build"

[project]
name = "raw-player"
dynamic = ["version"]
description = "Raw audio/video player for Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.12"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "example" },
]
test = ["pytest", "pytest-timeout", "numpy"]
example = ["numpy", "webcodecs-py", "mp4-py", "blend2d-py", "opencv-python"]
lint = ["ruff", "ty"]
pypi = ["auditwheel", "patchelf"]

[tool.scikit-build]
minimum-version = "0.11.3"
sdist.include = ["VERSION"]
build-dir = "_build/{wheel_tag}"

[tool.scikit-build.build]
verbose = false

[tool.scikit-build.cmake]
version = ">=4.1"
args = ["-DCMAKE_BUILD_TYPE=Release"]

[tool.scikit-build.ninja]
version = ">=1.13"

[tool.scikit-build.wheel]
packages = ["src/raw_player"]
expand-macos-universal-tags = true

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>.+)$"

[tool.uv]
package = false
managed = true
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]